# .github/workflows/deploy.yml

name: Deploy Frontend to VPS

on:
  push:
    branches:
      - main # Deploy automático ao entrar código na main
  workflow_dispatch: # Permite disparar o deploy manualmente pela aba Actions

# Evita que dois deploys deste repositório rodem ao mesmo tempo no VPS
concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Não é necessário fazer checkout: quem baixa o código é o próprio VPS,
      # dentro do script SSH abaixo.
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.0
        env:
          DEPLOY_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: DEPLOY_SHA
          script_stop: true # Aborta o deploy no primeiro comando que falhar
          command_timeout: 20m
          script: |
            set -euo pipefail

            cd /root/sellou_app/sellou-front2025

            echo "Buscando ${DEPLOY_SHA}..."
            git fetch --prune origin main

            # `git pull` (merge) SE RECUSA a sobrescrever um arquivo não versionado e aborta.
            # Em 2026-08-17 alguém deixou um `Dockerfile` editado à mão neste diretório para
            # contornar um bug, esse arquivo passou a colidir com a versão do repositório, e
            # TODO deploy seguinte abortou antes de baixar qualquer coisa — por dois dias, com
            # 13 commits parados, incluindo a correção de verdade daquele mesmo bug.
            #
            # `reset --hard` não tem essa recusa: ele torna a árvore idêntica ao commit alvo,
            # sobrescrevendo o que estiver no caminho. É o comportamento correto para um servidor
            # de deploy, que deve ser uma cópia fiel da `main` e não um lugar onde se edita código.
            #
            # Arquivos não versionados que NÃO existem no commit alvo (`.env.production`) são
            # preservados: `reset --hard` só mexe no que o commit alvo contém. Por isso não há
            # `git clean` aqui — ele apagaria justamente o `.env.production`.
            #
            # Fixa no SHA que disparou esta execução, não em `origin/main`, para que dois merges
            # em sequência não façam um deploy publicar o código do outro.
            echo "Sincronizando a árvore com o commit alvo..."
            git reset --hard "${DEPLOY_SHA}"

            ACTUAL_SHA="$(git rev-parse HEAD)"
            if [ "${ACTUAL_SHA}" != "${DEPLOY_SHA}" ]; then
              echo "::error::A árvore ficou em ${ACTUAL_SHA}, esperado ${DEPLOY_SHA}."
              exit 1
            fi
            echo "Código sincronizado em ${ACTUAL_SHA}."

            cd /root/sellou_app

            # Só o serviço do frontend. O backend tem pipeline própria (sellou-back2025) e não
            # deve ser reconstruído por um deploy de frontend — `docker compose up -d --build`
            # sem argumento reconstruía os três serviços, misturando os dois pipelines.
            echo "Reconstruindo o container do frontend..."
            docker compose up -d --build frontend

            # `up -d` retorna sucesso ao criar o container, mesmo que ele morra logo depois.
            # Sem esta checagem, um container que sobe e cai é reportado como deploy bem-sucedido.
            sleep 15
            if [ "$(docker compose ps -q frontend | xargs docker inspect -f '{{.State.Running}}')" != "true" ]; then
              echo "::error::O container do frontend não está rodando após o build."
              docker compose logs --tail 60 frontend
              exit 1
            fi

            echo "Deploy concluído em ${ACTUAL_SHA}."

      # Roda no runner, não no VPS: confirma que o site respondeu de fora, pela URL real.
      # Um container que sobe mas serve erro deixa de passar por deploy bem-sucedido.
      - name: Verificar que o site responde
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            STATUS="$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 https://app.sellou.com.br/sign-in || echo 000)"
            echo "tentativa ${attempt}: HTTP ${STATUS}"
            if [ "${STATUS}" = "200" ]; then
              echo "Site respondendo."
              exit 0
            fi
            sleep 10
          done
          echo "::error::app.sellou.com.br não respondeu 200 após o deploy (último status: ${STATUS})."
          exit 1
